name: Verify

on:
    pull_request:
    push:
        branches: [master]

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'yarn'
            - run: yarn install --frozen-lockfile
            # Advisories are published against dependencies we never chose, so a
            # blocking audit turns unrelated pull requests red. audit.yml runs the
            # same check on a schedule, where it can fail without holding up work.
            - run: yarn audit
              continue-on-error: true
            - run: yarn verify
